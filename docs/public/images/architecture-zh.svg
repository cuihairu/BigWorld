<rect width="1280" height="1130" rx="20" fill="#f8fafc"/>
<text x="40" y="48" class="title" text-anchor="start">BigWorld · 分布式 MMO 引擎架构</text>
<text x="40" y="80" class="body" text-anchor="start">多进程运行时 · 按权威域切分（Base / Cell / DB）· 控制面与恢复 · Mercury 网络 · 嵌入 Python 3.13</text>

