<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1130" viewBox="0 0 1280 1130" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">BigWorld · 分布式 MMO 引擎架构</title>
<desc id="desc">BigWorld 服务端是分布式多进程运行时，按运行时权威域而非业务域切分。客户端经 LoginApp 登录入口，LoginApp 完成挑战/认证并分配目标 BaseApp；BaseApp 拥有玩家会话、Base 实体与客户端通信，CellApp 拥有空间模拟、AOI、ghost 与 Cell 内逻辑，DBApp 以后台任务隔离阻塞数据库操作。BaseAppMgr/CellAppMgr/DBAppMgr 组成控制面与注册表，负责注册、发现、负载信息、扩容接纳与恢复协调。Reviver 通过 ping/death 监控关键组件并要求 machined 启动替换进程。machined 提供进程注册、接口发现、birth/death 监听与启动组件。运行时基础设施：Mercury 可靠 UDP 网络层、主 Reactor 事件循环、嵌入 Python 3.13 脚本与 EntityDef 契约。虚线为控制/监控关系，实线为业务数据。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs>
