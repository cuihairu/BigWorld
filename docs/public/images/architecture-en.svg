<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1130" viewBox="0 0 1280 1130" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">BigWorld · Distributed MMO Engine Architecture</title>
<desc id="desc">The BigWorld server is a distributed multi-process runtime split by runtime authority domain rather than business domain. The client enters through the LoginApp ingress; LoginApp performs challenge/authentication and assigns the target BaseApp. BaseApp owns player sessions, Base entities and client communication; CellApp owns space simulation, AOI, ghosts and in-Cell logic; DBApp isolates blocking database work behind background tasks. BaseAppMgr/CellAppMgr/DBAppMgr form the control plane and registry for registration, discovery, load info, scaling admission and recovery coordination. Reviver monitors critical components via ping/death and asks machined to start replacement processes. machined provides process registration, interface discovery, birth/death listeners and startup components. Runtime infrastructure: Mercury reliable UDP, main Reactor event loop, embedded Python 3.13, and the EntityDef contract. Dashed lines are control/monitoring relations, solid lines are business data.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs>
