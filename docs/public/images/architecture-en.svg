<g id="runtime-infra" data-node="runtime-infra"><rect x="80" y="910" width="1120" height="120" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="100" y="944" class="name" text-anchor="start">Runtime infrastructure (shared across processes)</text>
<text x="100" y="975" class="body" text-anchor="start">Mercury reliable UDP: Channel · Bundle · RPC · ACK/retransmit/windows/piggyback/indexed channel · version semantics</text>
<text x="100" y="1002" class="body" text-anchor="start">Event loop: main Reactor · Timer · FrequentTask · single main thread + background tasks committing back</text>
<text x="100" y="1029" class="body" text-anchor="start">Embedded Python 3.13 (migrated from 2.7) · EntityDef contract (entities.xml / .def / components / digest · shared by serialization/persistence/migration)</text>
</g>

